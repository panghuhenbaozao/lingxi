name: Build & Test Lingxi iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Pinyin Dictionary & Prototype
        run: |
          python3 Tools/engine_prototype.py

      - name: Select Xcode & Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Run Unit Tests on iOS Simulator
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F-]{36}')
          if [ -z "$DEST" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iOS Simulator: $DEST"
          if ! xcodebuild test \
            -project Lingxi.xcodeproj \
            -scheme Lingxi \
            -destination "platform=iOS Simulator,id=${DEST}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee test.log; then
            ERR_SUMMARY=$(grep -iE "(swift:[0-9]+:|error:|failed \(|Test Case .* failed|XCTAssert)" test.log | head -n 12 | tr '\r\n' ' | ' | cut -c1-1200 || true)
            echo "::error::TEST_ERRORS: ${ERR_SUMMARY}"
            TAIL=$(tail -n 15 test.log | tr '\r\n' ' | ' | cut -c1-900)
            echo "::error::TEST_TAIL: ${TAIL}"
            exit 1
          fi

      - name: Build Unsigned Release App & Package IPA
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project Lingxi.xcodeproj \
            -scheme Lingxi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee release.log; then
            ERR_SUMMARY=$(grep -iE "(swift:[0-9]+:|error:|BUILD FAILED)" release.log | head -n 12 | tr '\r\n' ' | ' | cut -c1-1200 || true)
            echo "::error::RELEASE_ERRORS: ${ERR_SUMMARY}"
            TAIL=$(tail -n 15 release.log | tr '\r\n' ' | ' | cut -c1-900)
            echo "::error::RELEASE_TAIL: ${TAIL}"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Lingxi.app build/Payload/
          test -d build/Payload/Lingxi.app/PlugIns/LingxiKeyboard.appex
          test -f build/Payload/Lingxi.app/PlugIns/LingxiKeyboard.appex/pinyin.sqlite
          cd build
          zip -r -q Lingxi-unsigned.ipa Payload
          ls -lh Lingxi-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lingxi-unsigned-ipa
          path: build/Lingxi-unsigned.ipa
          retention-days: 30

      - name: Publish Unsigned IPA to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest build/Lingxi-unsigned.ipa --clobber
          else
            gh release create latest build/Lingxi-unsigned.ipa \
              --title "Lingxi iOS IME (Unsigned IPA)" \
              --notes "Auto-built unsigned iOS IPA for SideStore / AltStore sideloading (verified with LingxiTests & WowType regress.tsv)."
          fi
